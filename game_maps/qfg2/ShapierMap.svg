      <stop offset="0%" stop-color="#FFE4C1" />
      <stop offset="50%" stop-color="#F4D481" />
      <stop offset="90%" stop-color="#E3A22E" />
    </radialGradient>
    <radialGradient id="palace-grad" cx="35%">
      <stop offset="0%" stop-color="#e0e0ff" />
      <stop offset="35%" stop-color="#D3D1DC" />
      <stop offset="70%" stop-color="#BDBFD8" />
      <stop offset="100%" stop-color="#8999B3" />
    </radialGradient>
    <linearGradient id="guild-fade">
        <stop offset="0%" stop-color="#8999B3" stop-opacity="1" />
      <stop offset="60%" stop-color="#BDBFD8" stop-opacity=".75" />
      <stop offset="95%" stop-color="#D3D1DC" stop-opacity="0.5" />
        <stop offset="100%" stop-color="#e0e0ff" stop-opacity="0.25"/>
    </linearGradient>
