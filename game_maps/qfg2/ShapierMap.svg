<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
xmlns:xlink="http://www.w3.org/1999/xlink"
version="1.1"
width="1280" height="720"
viewBox="0 0 1280 720" preserveAspectRatio="xMinYMin meet"
>
<title>Quest For Glory 2: Shapier Map</title>
<desc>This is a replica of the QfG2 Shapier map. This drawing hand-coded by Richard Todd 2025</desc>
<defs>
<style type="text/css">
<![CDATA[
   @font-face {
    font-family: written;
    src: url('../../_fonts/Charm-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
   }
   g.midtext text {
      font-family:  written;
      font-weight: bold;
      font-style: normal;
      fill: #371d10;
      font-size: 10pt;
      text-anchor: middle; 
      dominant-baseline: middle; 
   } 
   g.midtext textPath { 
      text-anchor: start; 
      dominant-baseline: middle; 
   }
]]>
</style>
    <filter id='roughpaper' x='0%' y='0%' width='100%' height="100%">
        <feTurbulence type="fractalNoise" baseFrequency='0.015' result='noise' numOctaves="5" seed="15" />
        <feTurbulence type="fractalNoise" baseFrequency='0.1' result='line-noise' numOctaves="5" seed="15" />
        <feDiffuseLighting in='noise' lighting-color='#faf6df' surfaceScale='3' result="diffused">
            <feDistantLight azimuth='45' elevation='60' />
        </feDiffuseLighting>
        <feDisplacementMap in="SourceGraphic" in2="line-noise" scale="3" result="displaced"/>
        <feComposite in="displaced" in2="noise" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="blendedDisplacement"/>
        <feComposite in="blendedDisplacement" in2="SourceGraphic" operator="over" result="penult"/>
        <feComposite in="penult" in2="diffused" operator="over" result="penult"/>
    </filter>
    <filter id='roughwrite' x='0%' y='0%' width='100%' height="100%">
        <feTurbulence type="fractalNoise" baseFrequency='0.1' result='line-noise' numOctaves="5" seed="10" />
        <feDisplacementMap in="SourceGraphic" in2="line-noise" scale="1" />
    </filter>
    <linearGradient id="red-fade" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#ff0000" stop-opacity="1"/>
        <stop offset="30%" stop-color="#ff0000" stop-opacity="1"/>
        <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="purple-fade">
        <stop offset="0%" stop-color="#ff0000" stop-opacity="1"/>
        <stop offset="20%" stop-color="purple" stop-opacity="1"/>
        <stop offset="80%" stop-color="purple" stop-opacity="1"/>
        <stop offset="100%" stop-color="#507090" stop-opacity="1"/>
    </linearGradient>
</defs>

<g filter="url(#roughpaper)">
    <rect x="0" y="0" width="100%" height="100%" fill="none"/>
    <g stroke-width="10" fill="none">
            <path stroke="url(#red-fade)" d="M30,30h100v250" pathLength="1" />
            <path stroke="url(#purple-fade)" d="M135,70h30v50h70" />
    </g>
    <circle stroke="#507090" stroke-width="10" fill="#507090" cx="268" cy="120" r="28" />
</g>
<g class="midtext" filter="url(#roughwrite)">
    <text x="205" y="110">Harik Plaza</text>
</g>  
</svg>
