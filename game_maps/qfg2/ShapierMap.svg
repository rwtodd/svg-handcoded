<title>Quest For Glory 2: Shapier Map</title>
<desc>This is a replica of the QfG2 Shapier map. This drawing hand-coded by Richard Todd 2025</desc>
<defs>
<style type="text/css">
<![CDATA[
   @font-face {
    font-family: written;
    src: url('../../_fonts/Charm-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
   }
   g.midtext text {
      font-family:  written;
      font-weight: bold;
      font-style: normal;
      fill: #371d10;
      font-size: 12pt;
      text-anchor: middle; 
      dominant-baseline: middle; 
   } 
   g.midtext text.larger {
      font-size: 15pt;
   }
]]>
</style>
    <filter id='roughpaper' x='0%' y='0%' width='100%' height="100%">
        <feTurbulence type="fractalNoise" baseFrequency='0.015' result='noise' numOctaves="5" seed="15" />
        <feTurbulence type="fractalNoise" baseFrequency='0.1' result='line-noise' numOctaves="5" seed="15" />
        <feDiffuseLighting in='noise' lighting-color='#ffffee' surfaceScale='5' result="diffused">
            <feDistantLight azimuth='45' elevation='80' />
        </feDiffuseLighting>
        <feDisplacementMap in="SourceGraphic" in2="line-noise" scale="2" result="displaced"/>
        <feComposite in="displaced" in2="noise" operator="arithmetic" k1="0" k2="0.6" k3="0.4" k4="0" result="blendedDisplacement"/>
        <feComposite in="blendedDisplacement" in2="SourceGraphic" operator="over" result="penult"/>
        <feComposite in="penult" in2="diffused" operator="over" result="penult"/>
    </filter>
    <filter id='roughwrite' x='0%' y='0%' width='100%' height="100%">
        <feTurbulence type="fractalNoise" baseFrequency='0.1' result='line-noise' numOctaves="5" seed="10" />
        <feDisplacementMap in="SourceGraphic" in2="line-noise" scale="0.5" />
    </filter>
    <linearGradient id="yellow-fade">
        <stop offset="0%" stop-color="#E79056" stop-opacity="1"/>
        <stop offset="30%" stop-color="#F2D48E" stop-opacity="1"/>
        <stop offset="100%" stop-color="#F2D48E" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="yellow-fade2">
        <stop offset="0%" stop-color="#E79056" stop-opacity="1"/>
        <stop offset="50%" stop-color="#F2D48E" stop-opacity="1"/>
        <stop offset="100%" stop-color="#F2D48E" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="green-fade"  x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#B4C261" stop-opacity="1"/>
        <stop offset="20%" stop-color="#B4C261" stop-opacity="1"/>
        <stop offset="100%" stop-color="#B4C261" stop-opacity="0.2"/>
    </linearGradient>    
    <linearGradient id="purple-fade"  x1="0" x2="0" y1="1" y2="0">
        <stop offset="0%" stop-color="#B88E92" stop-opacity="1"/>
        <stop offset="20%" stop-color="#B88E92" stop-opacity="1"/>
        <stop offset="100%" stop-color="#B88E92" stop-opacity="0.2"/>
    </linearGradient>    
    <path id="plaza-shape" stroke="none" d="M0.924,0.383 L0.383,0.924 L-0.383,0.924 L-0.924,0.383 L-0.924,-0.383 L-0.383,-0.924 L0.383,-0.924 L0.924,-0.383 Z" />
